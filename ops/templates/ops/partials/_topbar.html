{# Shared top bar with the logged-in user's real name and role. #}
{# Optional: `display_name` / `role_label` override the defaults (used by the contractor portal). #}
<header class="sticky top-0 z-30 bg-white border-b border-surface-container-high">
    <div class="flex items-center justify-end px-4 lg:px-6 py-3 gap-2 sm:gap-3">
        <button type="button" data-sidebar-open aria-label="Open menu" aria-expanded="false"
                class="lg:hidden mr-auto p-2 rounded-xl border border-surface-container-high hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-ink-light" style="font-size: 20px;">menu</span>
        </button>

        <button class="p-2 rounded-xl border border-surface-container-high hover:bg-surface-container transition-colors" title="Toggle theme">
            <span class="material-symbols-outlined text-ink-light" style="font-size: 20px;">light_mode</span>
        </button>

        <button class="relative p-2 rounded-xl border border-surface-container-high hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-ink-light" style="font-size: 20px;">notifications</span>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full"></span>
        </button>

        <div class="flex items-center gap-2 min-w-0 pl-1 pr-1 py-1 rounded-xl hover:bg-surface-container transition-colors cursor-default">
            <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-primary" style="font-size: 18px;">person</span>
            </div>
            <div class="hidden md:flex flex-col leading-tight min-w-0">
                <span class="text-sm font-semibold text-ink truncate max-w-[180px]">{{ display_name|default:user.username }}</span>
                <span class="text-xs text-ink-light">{{ role_label|default:user.role|title }}</span>
            </div>
            <span class="material-symbols-outlined text-ink-light hidden md:block" style="font-size: 18px;">expand_more</span>
        </div>
    </div>
</header>
