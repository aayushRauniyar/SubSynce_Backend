{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SubSync{% endblock %}</title>
    <meta name="theme-color" content="#F5F3F1">

    <!-- Theme: apply the saved choice before first paint so there is no flash.
         Stored values: "light" (default), "dark", "system". -->
    <script>
        (function () {
            var theme = 'light';
            try { theme = localStorage.getItem('subsync-theme') || 'light'; } catch (e) {}
            var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
    <!-- Pretendard Font -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    
    <!-- Material Symbols Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Tailwind CSS (Play CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // SubSync palette v2. Values live in static/css/app.css as
                        // CSS variables so the dark theme can swap them.
                        surface: 'rgb(var(--c-surface) / <alpha-value>)',
                        card: 'rgb(var(--c-surface-lowest) / <alpha-value>)',
                        sidenav: 'rgb(var(--c-surface-low) / <alpha-value>)',
                        'surface-container': 'rgb(var(--c-surface-c) / <alpha-value>)',
                        'surface-container-high': 'rgb(var(--c-surface-high) / <alpha-value>)',
                        greige: 'rgb(var(--c-surface-highest) / <alpha-value>)',
                        primary: 'rgb(var(--c-primary) / <alpha-value>)',
                        'primary-hover': 'rgb(var(--c-primary-strong) / <alpha-value>)',
                        'on-primary': 'rgb(var(--c-on-accent) / <alpha-value>)',
                        'secondary-container': 'rgb(var(--c-secondary-container) / <alpha-value>)',
                        'on-secondary-container': 'rgb(var(--c-on-secondary-container) / <alpha-value>)',
                        ink: 'rgb(var(--c-ink) / <alpha-value>)',
                        'text-2': 'rgb(var(--c-text-2) / <alpha-value>)',
                        'ink-light': 'rgb(var(--c-ink-light) / <alpha-value>)',
                        outline: 'rgb(var(--c-outline) / <alpha-value>)',
                        success: 'rgb(var(--c-success) / <alpha-value>)',
                        warning: 'rgb(var(--c-warning) / <alpha-value>)',
                        error: 'rgb(var(--c-error) / <alpha-value>)',
                        scheduled: 'rgb(var(--c-scheduled) / <alpha-value>)',
                        completed: 'rgb(var(--c-completed) / <alpha-value>)',
                        missed: 'rgb(var(--c-missed) / <alpha-value>)',
                        violet: 'rgb(var(--c-violet) / <alpha-value>)',
                    },
                    transitionDuration: { DEFAULT: '300ms' },
                    transitionTimingFunction: { DEFAULT: 'cubic-bezier(0, 0, 0.2, 1)' },
                    fontFamily: {
                        sans: ['Pretendard Variable', 'Pretendard', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-ink font-sans min-h-screen">
    
    <!-- Messages (Success, Error, etc.) -->
    {% if messages %}
    <div class="fixed top-4 right-4 left-4 sm:left-auto sm:max-w-sm z-[60] space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl shadow-lg {% if message.tags == 'success' %}bg-success{% elif message.tags == 'error' %}bg-error{% else %}bg-primary{% endif %} text-on-primary">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <!-- Main Content Area -->
    {% block content %}
    <!-- Child templates will fill this -->
    {% endblock %}
    
    <!-- JavaScript -->
    <script src="{% static 'js/theme.js' %}"></script>
    {% block extra_js %}{% endblock %}
    
    <!-- Mobile sidebar drawer: works for any page with a [data-sidebar] aside -->
    <script>
        (function () {
            var sidebar = document.querySelector('[data-sidebar]');
            if (!sidebar) return;
            var overlay = document.querySelector('[data-sidebar-overlay]');

            function setOpen(open) {
                sidebar.classList.toggle('-translate-x-full', !open);
                if (overlay) overlay.classList.toggle('hidden', !open);
                document.querySelectorAll('[data-sidebar-open]').forEach(function (btn) {
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            }

            document.querySelectorAll('[data-sidebar-open]').forEach(function (btn) {
                btn.addEventListener('click', function () { setOpen(true); });
            });
            document.querySelectorAll('[data-sidebar-close]').forEach(function (btn) {
                btn.addEventListener('click', function () { setOpen(false); });
            });
            if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') setOpen(false);
            });
        })();
    </script>

    <!-- Auto-hide messages after 5 seconds -->
    <script>
        setTimeout(function() {
            document.querySelectorAll('.fixed.top-4').forEach(function(el) {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = '0';
                setTimeout(function() { el.remove(); }, 500);
            });
        }, 5000);
    </script>
</body>
</html>
